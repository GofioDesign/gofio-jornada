<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gofio Jornada</title>
  <meta name="description" content="Control horario, desplazamientos y clientes para equipos de trabajo.">
  <meta name="theme-color" content="#1f3a2e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icono-192.png">
  <link rel="stylesheet" href="css/app.css?v=dev">
  <script type="importmap">
    { "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm",
      "qrcode-generator": "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/+esm"
    } }
  </script>
  <script type="module" src="js/main.js?v=dev"></script>
</head>
<body>
  <header class="barra">
    <a class="marca" href="#/">Gofio<span>Jornada</span></a>
    <div id="empresa" class="empresa"></div>
    <nav id="menu" class="menu" aria-label="Secciones" hidden></nav>
  </header>
  <main id="vista" class="vista"><div class="cargando-pagina">Cargando…</div></main>
  <nav id="espacios" class="espacios" aria-label="Espacio" hidden></nav>
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
  <script>
    // Si la app no arranca (p. ej. un archivo antiguo en caché tras publicar), ofrece recargar limpiando la caché en vez de quedarse en «Cargando».
    setTimeout(function () {
      var c = document.querySelector('.cargando-pagina');
      if (!c) return;
      c.innerHTML = 'La app no ha terminado de cargar. <button class="btn primario" type="button">Recargar</button>';
      c.querySelector('button').onclick = function () {
        var limpiar = window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : Promise.resolve();
        limpiar.then(function () { location.reload(); }, function () { location.reload(); });
      };
    }, 10000);
  </script>
  <noscript>Esta aplicación necesita JavaScript.</noscript>
</body>
</html>
